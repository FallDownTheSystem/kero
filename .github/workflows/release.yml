name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand, it releases mygo.json's version from the branch it runs
  # on, in a new draft: the draft of the version, if there is one, and its
  # tag go, so the release is of this commit. A published release stays.
  workflow_dispatch:

permissions:
  contents: write # the draft release, its tag, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json's version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Replace the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "false" ]; then
            echo "::error::$tag is published already: bump the version in mygo.json"
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git push origin ":refs/tags/$tag"
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # Signs with the Developer ID of mygo.json and notarizes with its
      # NOTARY profile, both from a keychain of the job's own.
      - name: Import the certificate and the notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials NOTARY --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          jq --arg k "$keychain" '.macos.notarize.keychain = $k' mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  # The server build of Kero, for machines whose sessions the app shows
  # (Settings › Hosts): kerod and the kero CLI without the app, with
  # libghostty-vt, signed with the key of the app's updates, which its
  # updates check (internal/update), and install-server.sh, of this
  # version.
  server:
    needs: draft-release
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test the server's packages
        run: go test ./internal/remote/ ./internal/update/ ./internal/settings/ ./internal/tailscale/
      - name: Build
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          mkdir -p build/server
          go mod download github.com/egoist/mygo
          manifest="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/terminal/mygo-plugin.json"
          for arch in amd64 arm64; do
            stage="build/server/linux-$arch"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version -X github.com/egoist/mygo.production=1" \
              -o "$stage/kero" ./cmd/kero-server
            url="$(jq -r ".libraries[] | select(.name == \"libghostty-vt\") | .files[\"linux-$arch\"].url" "$manifest")"
            sum="$(jq -r ".libraries[] | select(.name == \"libghostty-vt\") | .files[\"linux-$arch\"].sha256" "$manifest")"
            curl -fsSL "$url" -o "$stage/libghostty-vt.so"
            echo "$sum  $stage/libghostty-vt.so" | sha256sum -c -
            tar -C "$stage" -czf "build/server/kero-server-$version-linux-$arch.tar.gz" kero libghostty-vt.so
          done
          sed "s/@VERSION@/$version/" scripts/install-server.sh > build/server/install-server.sh
      - name: Check that the build runs with no display
        run: |
          set -eu
          dir="$(mktemp -d)"
          tar -xzf build/server/kero-server-*-linux-amd64.tar.gz -C "$dir"
          env -u DISPLAY -u WAYLAND_DISPLAY KERO_HOME="$dir/home" KERO_CONFIG="$dir/config" "$dir/kero" version
          env -u DISPLAY -u WAYLAND_DISPLAY KERO_HOME="$dir/home" KERO_CONFIG="$dir/config" "$dir/kero" new -n check -- echo ok
          sleep 1
          env KERO_HOME="$dir/home" KERO_CONFIG="$dir/config" "$dir/kero" read check | grep -q ok
          env KERO_HOME="$dir/home" KERO_CONFIG="$dir/config" "$dir/kero" daemon stop
      - name: Sign
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run ./internal/update/sign build/server/*.tar.gz
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            build/server/*.tar.gz build/server/*.tar.gz.sig build/server/*.tar.gz.sha256 build/server/install-server.sh
