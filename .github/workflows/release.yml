name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand, it releases mygo.json's version from the branch it runs
  # on, in a new draft: the draft of the version, if there is one, and its
  # tag go, so the release is of this commit. A published release stays.
  workflow_dispatch:

permissions:
  contents: write # the draft release, its tag, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json's version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Replace the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "false" ]; then
            echo "::error::$tag is published already: bump the version in mygo.json"
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git push origin ":refs/tags/$tag"
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # Signs with the Developer ID of mygo.json and notarizes with its
      # NOTARY profile, both from a keychain of the job's own.
      - name: Import the certificate and the notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials NOTARY --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          jq --arg k "$keychain" '.macos.notarize.keychain = $k' mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  # The server build of Kero, for machines whose sessions the app shows
  # (Settings › Hosts): kerod and the kero CLI without the app, with
  # libghostty-vt, which install-server.sh installs and the server build
  # updates itself from (internal/update).
  server:
    needs: draft-release
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/...
      - name: Build
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          mkdir -p build/server
          go mod download github.com/egoist/mygo
          manifest="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/terminal/mygo-plugin.json"
          for arch in amd64 arm64; do
            stage="build/server/linux-$arch"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version -X github.com/egoist/mygo.production=1" \
              -o "$stage/kero" ./cmd/kero-server
            url="$(jq -r ".libraries[] | select(.name == \"libghostty-vt\") | .files[\"linux-$arch\"].url" "$manifest")"
            sum="$(jq -r ".libraries[] | select(.name == \"libghostty-vt\") | .files[\"linux-$arch\"].sha256" "$manifest")"
            curl -fsSL "$url" -o "$stage/libghostty-vt.so"
            echo "$sum  $stage/libghostty-vt.so" | sha256sum -c -
            # The marker of an install that updates itself (update.Marker).
            : > "$stage/.kero-server"
            tar -C "$stage" -czf "build/server/kero-server-$version-linux-$arch.tar.gz" kero libghostty-vt.so .kero-server
          done
          sed "s/@VERSION@/$version/" scripts/install-server.sh > build/server/install-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            build/server/*.tar.gz
            build/server/install-server.sh

  # Each archive as a user gets it: installed by install-server.sh, from
  # a mirror of the release (KERO_RELEASES), run through the command's
  # link with no display, on its own architecture.
  server-check:
    needs: server
    name: Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: build/server
      - name: Install and run a session
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          rel="$RUNNER_TEMP/releases/v$version"
          mkdir -p "$rel"
          cp build/server/kero-server-*-linux-${{ matrix.arch }}.tar.gz "$rel/"
          (cd "$rel" && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
          export HOME="$RUNNER_TEMP/home" XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          mkdir -p "$HOME"
          unset DISPLAY WAYLAND_DISPLAY
          KERO_RELEASES="file://$RUNNER_TEMP/releases" sh build/server/install-server.sh --no-service
          kero="$HOME/.local/bin/kero"
          "$kero" version
          "$kero" new -n check -- sh -c 'echo kero-ok'
          for i in $(seq 40); do
            "$kero" read check | grep -q kero-ok && break
            [ "$i" = 40 ] && { "$kero" read check; cat "$HOME/.config/kero/kerod.log"; exit 1; }
            sleep 0.25
          done
          "$kero" daemon stop
          # libghostty-vt came with the archive: none was downloaded.
          test ! -e "$XDG_CACHE_HOME/mygo/natives"

  # Signed apart from the jobs that run what was built, with the key the
  # app's updates are signed with, which the server build checks.
  server-sign:
    needs: server-check
    name: Sign the server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: build/server
      - name: Sign
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run ./internal/update/sign build/server/*.tar.gz
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            build/server/*.tar.gz build/server/*.tar.gz.sig build/server/*.tar.gz.sha256 build/server/install-server.sh

  # A release without the server build would break install-server.sh's
  # latest link, and the app's Install and Update of hosts: say so before
  # it is published.
  assets:
    needs: [build, server-sign]
    name: Check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          names="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for want in install-server.sh install.sh \
            "kero-server-$version-linux-amd64.tar.gz" "kero-server-$version-linux-amd64.tar.gz.sig" \
            "kero-server-$version-linux-arm64.tar.gz" "kero-server-$version-linux-arm64.tar.gz.sig"; do
            echo "$names" | grep -qxF "$want" || { echo "::error::v$version has no $want"; exit 1; }
          done
